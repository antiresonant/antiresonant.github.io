<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Life State Topology</title>
<script>if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.dataset.theme='dark';</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root {
  --bg:      #f2f3f5;
  --surface: #e8eaee;
  --border:  #d0d4dc;
  --text:    #1a1d24;
  --muted:   #7a8090;
  --accent:  #3d7a64;
  --red:     #a03030;
  --blue:    #3a5a8c;
  --gold:    #9a7a38;
}
[data-theme="dark"] {
  --bg:      #07080b;
  --surface: #101218;
  --border:  #1b1f28;
  --text:    #d6d9e0;
  --muted:   #545a68;
  --accent:  #5c8f7a;
  --red:     #b44a4a;
  --blue:    #4f6fa8;
  --gold:    #c3a96b;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }
body {
  background:var(--bg); color:var(--text);
  font-family:'IBM Plex Sans',sans-serif;
  display:flex; flex-direction:column;
  touch-action:pan-y;
}

/* ── HEADER ── */
header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px 8px; border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.logo { font-size:0.82rem; font-weight:600; letter-spacing:-0.01em; }
.logo em { color:var(--accent); font-style:normal; }
.hdr-btns { display:flex; gap:6px; align-items:center; }
.hdr-btn {
  font-family:'IBM Plex Mono',monospace; font-size:0.5rem; letter-spacing:0.06em;
  padding:5px 10px; border:1px solid var(--border); border-radius:5px;
  background:transparent; color:var(--muted); cursor:pointer;
}
.hdr-btn:active { background:var(--surface); color:var(--text); }
.mode-toggle { display:flex; gap:2px; background:var(--border); border-radius:6px; padding:2px; }
.mode-btn {
  font-family:'IBM Plex Mono',monospace; font-size:0.5rem; letter-spacing:0.06em;
  padding:4px 10px; border:none; border-radius:4px;
  background:transparent; color:var(--muted); cursor:pointer;
}
.mode-btn.active { background:var(--bg); color:var(--text); }

/* ── MAIN SWIPEABLE AREA ── */
#main {
  flex:1; overflow:hidden; position:relative;
  touch-action:pan-y;
}
#card-area {
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start;
  padding:16px 20px 8px;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}

/* ── CHAPTER BADGE ── */
.chapter-badge {
  font-family:'IBM Plex Mono',monospace; font-size:0.5rem;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--muted); margin-bottom:8px;
}

/* ── GLYPH ── */
.glyph-wrap {
  width:min(45vw, 200px);
  margin-bottom:12px;
}
.glyph-wrap svg { width:100%; height:auto; color:var(--text); }

/* ── STATE INFO ── */
.state-name {
  font-size:1.8rem; font-weight:600;
  letter-spacing:-0.02em; text-align:center;
  margin-bottom:4px; transition:color 0.3s;
}
.state-name.stressed  { color:var(--red); }
.state-name.ascending { color:var(--blue); }
.state-name.thriving  { color:var(--accent); }
.state-name.neutral   { color:var(--text); }
.state-sub {
  font-family:'IBM Plex Mono',monospace; font-size:0.72rem;
  color:var(--muted); text-align:center; line-height:1.6;
  margin-bottom:12px;
}
.state-example {
  font-family:'IBM Plex Mono',monospace; font-size:0.7rem;
  color:var(--text); text-align:center; line-height:1.55;
  opacity:0.7; padding:10px 0;
  border-top:2px solid var(--border);
  margin-bottom:14px;
}

/* ── CONNECTIONS CHIPS ── */
.conn-section { width:100%; margin-bottom:10px; }
.conn-label {
  font-family:'IBM Plex Mono',monospace; font-size:0.48rem;
  letter-spacing:0.12em; text-transform:uppercase;
  color:var(--muted); margin-bottom:6px;
}
.conn-chips {
  display:flex; flex-wrap:wrap; gap:6px;
}
.conn-chip {
  font-family:'IBM Plex Mono',monospace; font-size:0.62rem;
  padding:6px 12px; border-radius:6px;
  border:1px solid var(--border);
  background:var(--surface); color:var(--text);
  cursor:pointer; transition:all 0.15s;
}
.conn-chip:active { background:var(--accent); color:white; border-color:var(--accent); }
.conn-chip.stressed { border-color:var(--red); color:var(--red); }
.conn-chip.ascending { border-color:var(--blue); color:var(--blue); }
.conn-chip.thriving { border-color:var(--accent); color:var(--accent); }

/* ── COMPARE MODE ── */
.compare-wrap {
  width:100%; display:flex; flex-direction:column;
  align-items:center; gap:12px;
}
.compare-section {
  width:100%; display:flex; flex-direction:column;
  align-items:center; gap:6px;
  padding:12px; border-radius:8px;
  background:var(--surface); border:1px solid var(--border);
}
.compare-label {
  font-family:'IBM Plex Mono',monospace; font-size:0.55rem;
  letter-spacing:0.12em; text-transform:uppercase;
}
.compare-label.now-label { color:var(--muted); }
.compare-label.goal-label { color:var(--gold); }
.compare-glyph { width:min(28vw, 120px); }
.compare-glyph svg { width:100%; height:auto; color:var(--text); }
.compare-name { font-size:1.2rem; font-weight:600; }
.compare-sub {
  font-family:'IBM Plex Mono',monospace; font-size:0.65rem;
  color:var(--muted); text-align:center; line-height:1.5;
}

.action-list {
  width:100%; display:flex; flex-direction:column;
  gap:4px; padding:8px 0;
}
.action-item {
  font-family:'IBM Plex Mono',monospace; font-size:0.68rem;
  display:flex; gap:8px; align-items:center;
}
.action-verb {
  font-size:0.55rem; letter-spacing:0.1em; text-transform:uppercase;
  font-weight:600;
}
.action-item.pos .action-verb { color:var(--accent); }
.action-item.neg .action-verb { color:var(--red); }
.action-edge { color:var(--text); }
.action-same {
  font-family:'IBM Plex Mono',monospace; font-size:0.72rem;
  color:var(--accent); text-align:center; padding:8px 0;
}

.goal-btn {
  font-family:'IBM Plex Mono',monospace; font-size:0.6rem;
  letter-spacing:0.08em; padding:8px 20px;
  border:1px solid var(--gold); border-radius:6px;
  background:transparent; color:var(--gold); cursor:pointer;
  margin-top:4px;
}
.goal-btn:active { background:var(--gold); color:var(--bg); }
.goal-btn.clear { border-color:var(--muted); color:var(--muted); }
.goal-btn.clear:active { background:var(--muted); color:var(--bg); }

/* ── FILMSTRIP ── */
.filmstrip-wrap {
  flex-shrink:0; border-top:1px solid var(--border);
  overflow-x:auto; overflow-y:hidden;
  padding:6px 12px 8px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.filmstrip-wrap::-webkit-scrollbar { display:none; }
.filmstrip {
  display:flex; gap:4px; width:max-content;
}
.strip-card {
  flex-shrink:0; width:54px;
  display:flex; flex-direction:column;
  align-items:center; gap:2px;
  cursor:pointer; opacity:0.25;
  padding:4px 2px; border-radius:5px;
  border:1px solid transparent;
  transition:opacity 0.15s;
}
.strip-card.active { opacity:1; background:var(--surface); border-color:var(--border); }
.strip-card.goal-card { border-color:var(--gold) !important; opacity:1; }
.strip-card svg { width:100%; height:auto; color:var(--text); }
.strip-name {
  font-size:0.38rem; font-weight:600;
  text-align:center; color:var(--text); line-height:1.15;
}

/* ── SWIPE HINT ── */
.swipe-hint {
  position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
  font-family:'IBM Plex Mono',monospace; font-size:0.5rem;
  color:var(--muted); opacity:0.5; pointer-events:none;
  transition:opacity 0.5s;
}
.swipe-hint.hidden { opacity:0; }
</style>
</head>
<body>

<header>
  <div class="logo">Life State <em>Topology</em></div>
  <div class="hdr-btns">
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-explore" onclick="setMode('explore')">EXPLORE</button>
      <button class="mode-btn" id="btn-compare" onclick="setMode('compare')">COMPARE</button>
    </div>
    <button class="hdr-btn" id="theme-btn" onclick="toggleTheme()">◑ DARK</button>
  </div>
</header>

<div id="main">
  <div id="card-area"></div>
  <div class="swipe-hint" id="swipe-hint">← swipe to navigate →</div>
</div>

<div class="filmstrip-wrap">
  <div class="filmstrip" id="filmstrip"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════
// GLYPH RENDERER (sealed IIFE — identical to desktop)
// ══════════════════════════════════════════════════════════
const glyph = (() => {
  'use strict';
  const CFG = Object.freeze({
    SQUIGGLY:false, GW:300,GH:460,CR:32,CR_TIP:18,RO:13,
    H:[150,20],E:[150,108],M:[44,224],T:[256,224],Nd:[150,340],A:[150,432],
  });
  const FDEF = CFG.SQUIGGLY?`<defs><filter id="r" x="-8%" y="-8%" width="116%" height="116%">
  <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="14" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>`:'';
  const FX=CFG.SQUIGGLY?'filter="url(#r)"':'';
  function es(t){if(!t)return null;return{sw:Math.pow(t/4,1.8)*22,c:'currentColor'};}
  function ss(x1,y1,x2,y2,r){const dx=x2-x1,dy=y2-y1,l=Math.sqrt(dx*dx+dy*dy)||1;return[x1+dx/l*r,y1+dy/l*r,x2,y2];}
  function se(x1,y1,x2,y2,r){const dx=x2-x1,dy=y2-y1,l=Math.sqrt(dx*dx+dy*dy)||1;return[x1,y1,x2-dx/l*r,y2-dy/l*r];}
  function dl(x1,y1,x2,y2,t){const s=es(t);if(!s)return'';return`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${s.c}" stroke-width="${s.sw}" stroke-linecap="round" ${FX}/>`;}
  return function glyph(g,scale=1){
    const{hE=0,eM=0,eT=0,mT=0,mN=0,tN=0,nA=0,moneyHealth=0,timeHealth=0}=g;
    const{GW,GH,CR,CR_TIP,RO}=CFG;
    const[Hx,Hy]=CFG.H,[Ex,Ey]=CFG.E,[Mx,My]=CFG.M,[Tx,Ty]=CFG.T,[Nx,Ny]=CFG.Nd,[Ax,Ay]=CFG.A;
    const LRAIL=Mx+CR_TIP,RRAIL=Tx-CR_TIP;
    let s=FDEF;
    if(moneyHealth>0){const f=es(moneyHealth);if(f){const tY=My-CR;s+=`<polyline points="${Mx},${tY} ${Mx},${Hy} ${Hx},${Hy}" stroke="${f.c}" stroke-width="${f.sw}" fill="none" stroke-linecap="square" stroke-linejoin="miter" ${FX}/>`; }}
    if(timeHealth>0){const f=es(timeHealth);if(f){const tY=Ty-CR;s+=`<polyline points="${Tx},${tY} ${Tx},${Hy} ${Hx},${Hy}" stroke="${f.c}" stroke-width="${f.sw}" fill="none" stroke-linecap="square" stroke-linejoin="miter" ${FX}/>`; }}
    s+=dl(Hx,Hy,Ex,Ey,hE);
    if(eM){const[x1,y1,x2,y2]=se(Ex,Ey,Mx,My-RO,CR_TIP);s+=dl(x1,y1,x2,y2,eM);}
    if(eT){const[x1,y1,x2,y2]=se(Ex,Ey,Tx,Ty-RO,CR_TIP);s+=dl(x1,y1,x2,y2,eT);}
    if(mT>0){const st=es(mT);for(const sg of[-1,+1]){const ry=My+sg*RO;s+=`<line x1="${LRAIL.toFixed(1)}" y1="${ry.toFixed(1)}" x2="${RRAIL.toFixed(1)}" y2="${ry.toFixed(1)}" stroke="${st.c}" stroke-width="${st.sw}" stroke-linecap="round" ${FX}/>`;}}
    if(mN){const[x1,y1,x2,y2]=ss(Mx,My+RO,Nx,Ny,CR_TIP);s+=dl(x1,y1,x2,y2,mN);}
    if(tN){const[x1,y1,x2,y2]=ss(Tx,Ty+RO,Nx,Ny,CR_TIP);s+=dl(x1,y1,x2,y2,tN);}
    s+=dl(Nx,Ny,Ax,Ay,nA);
    return`<svg width="${Math.round(GW*scale)}" height="${Math.round(GH*scale)}" viewBox="0 0 ${GW} ${GH}" style="overflow:visible;display:block">${s}</svg>`;
  };
})();

// ══════════════════════════════════════════════════════════
// DATA (identical to desktop)
// ══════════════════════════════════════════════════════════
const STATES = {
  destitute:{name:'Destitute',sub:'nothing is coupled\nsystem is inert',type:'neutral',chapter:'I · Zero',example:'A refugee arriving with nothing — no language, no contacts, no income. Or a released prisoner with $50 and no prospects.',g:{hE:1}},
  dependent:{name:'Dependent',sub:'kept alive externally\nno self-coupling',type:'neutral',chapter:'I · Zero',example:'A child. A severely disabled adult in full-time care. Someone in a coma kept alive by a hospital. Alive, but the system is not their own.',g:{hE:2}},
  homeless:{name:'Homeless',sub:'time-rich, money-zero\nno network access',type:'neutral',chapter:'II · Survival',example:'Someone sleeping rough but physically healthy — has all day, zero dollars, no phone. Time exists but cannot be converted.',g:{hE:1,tN:1,timeHealth:1}},
  subsistence:{name:'Subsistence',sub:'bare time↔money loop\nno compounding',type:'neutral',chapter:'II · Survival',example:'A day labourer paid cash for physical work — enough to eat, rent a bed, repeat tomorrow. No savings, no trajectory.',g:{hE:1,eM:1,mT:1,moneyHealth:1}},
  sick_broke:{name:'Sick & Broke',sub:'health collapsed\ncascade failure',type:'stressed',chapter:'II · Survival',example:'A gig worker who gets injured with no insurance. Medical debt compounds, can\'t work, health deteriorates further. The system collapses inward.',g:{eM:1,mT:1}},
  debt_spiral:{name:'Debt Spiral',sub:'money flows out\nagency zero',type:'stressed',chapter:'III · Traps',example:'Someone on payday loans rolling over at 300% APR. Works full time, pays interest, principal never shrinks. Every dollar earned is already owed.',g:{hE:1,eM:2,mT:1,moneyHealth:1}},
  wage_trapped:{name:'Wage Trapped',sub:'time sold for money\nno reinvestment',type:'stressed',chapter:'III · Traps',example:'A licensed nurse in a private hospital earning just enough to cover rent, car, and food. Skilled and employed — but every hour sold leaves nothing to compound.',g:{hE:1,eM:2,mT:3,moneyHealth:1}},
  burned_out:{name:'Burned Out',sub:'system overloaded\nhealth & energy severed',type:'stressed',chapter:'III · Traps',example:'A consultant who ran three simultaneous projects for two years. Still technically employed. Cannot feel anything. Sleep is not restorative. The machine is running on fumes.',g:{eM:2,mT:3,mN:1,tN:1,nA:1}},
  martyr:{name:'Martyr',sub:'gives time & network\nself depleted',type:'stressed',chapter:'III · Traps',example:'A parent who gave up their career entirely for their children. A carer who cancelled their own life. Gives everything — receives meaning in exchange, not resources.',g:{tN:3}},
  isolated_grinder:{name:'Isolated Grinder',sub:'energy→money only\nnetwork starved',type:'stressed',chapter:'III · Traps',example:'A self-taught developer grinding leetcode and freelance gigs alone. Income growing, zero relationships. The money works but no one knows their name.',g:{hE:1,eM:3,mT:2,moneyHealth:1}},
  time_poor_rich:{name:'Time-Poor Rich',sub:'high income\nzero bandwidth',type:'stressed',chapter:'III · Traps',example:'A Big Law associate billing 2,800 hours a year. $300k salary, no weekends, no hobbies, no sleep. Money is abundant; the person is not.',g:{hE:1,eM:3,mT:3,mN:1,nA:1,moneyHealth:2}},
  workaholic:{name:'Workaholic',sub:'energy→money maxed\nhealth loop ignored',type:'stressed',chapter:'IV · Detours',example:'Early Jeff Bezos — famously sleeping on the office floor, building Amazon at the cost of everything else. The company grew. The body and relationships did not.',g:{hE:1,eM:3,mT:3,moneyHealth:1}},
  hedonist:{name:'Hedonist',sub:'money consumed\nnot reinvested',type:'stressed',chapter:'IV · Detours',example:'A lottery winner who blows the payout in three years. Or a mid-career professional spending every raise on lifestyle upgrades — cars, bottles, travel — with no net worth change.',g:{hE:1,eM:1,moneyHealth:1}},
  social_climber:{name:'Social Climber',sub:'network wide\nagency hollow',type:'stressed',chapter:'IV · Detours',example:'Someone who attends every event, knows everyone, posts constantly — but hasn\'t built anything. The network is wide and shallow. Influence without substance.',g:{hE:1,eM:1,mN:2,tN:3,nA:1}},
  recluse_wealthy:{name:'Recluse Wealthy',sub:'assets compound\nperson withdrawn',type:'neutral',chapter:'IV · Detours',example:'Howard Hughes in his later years — enormous wealth, total withdrawal. Or a tech founder who sold their company and retreated. Assets compound passively. The person has stopped participating.',g:{hE:1,moneyHealth:2,mT:1}},
  pivot:{name:'The Pivot',sub:'decoupling old edges\nrerouting the system',type:'ascending',chapter:'V · Ascending',example:'A 38-year-old lawyer who quits to study machine learning. A burnout survivor who spends six months hiking before re-entering. The moment the old system is consciously dismantled.',g:{hE:2,eM:1,mT:1,mN:1,tN:1,nA:3,moneyHealth:1,timeHealth:1}},
  early_career:{name:'Early Career',sub:'building all edges\nfrom weak baseline',type:'ascending',chapter:'V · Ascending',example:'A 24-year-old junior engineer at their first real job. Earning little, learning fast, making friends in the industry. All couplings exist but none are strong yet.',g:{hE:2,eM:1,mT:1,mN:1,tN:1,nA:1,moneyHealth:1,timeHealth:1}},
  hustle_phase:{name:'Hustle Phase',sub:'energy compressed\ninto capital',type:'ascending',chapter:'V · Ascending',example:'A founder pre-product-market-fit — working 80 hours, eating poorly, skipping social events. Deliberately burning time and health to build capital and optionality.',g:{hE:1,eM:3,mT:2,mN:1,tN:1,nA:2,moneyHealth:1}},
  skill_compounder:{name:'Skill Compounder',sub:'time→competence\nbefore money',type:'ascending',chapter:'V · Ascending',example:'A surgeon in residency. A novelist writing their first three unpublished books. A researcher doing a PhD. Time is being exchanged for capabilities that will compound later.',g:{hE:2,eM:1,mT:1,mN:2,tN:2,nA:2,timeHealth:2}},
  self_investor:{name:'Self-Investor',sub:'health as primary asset\nboth feedbacks open',type:'ascending',chapter:'V · Ascending',example:'Someone who deliberately structures life around sleep, training, and recovery while building a business. Naval Ravikant post-AngelList — optimising the substrate, not just the output.',g:{hE:3,eM:1,mT:1,mN:1,tN:1,nA:2,moneyHealth:2,timeHealth:2}},
  network_builder:{name:'Network Builder',sub:'time→relationships\nbefore money',type:'ascending',chapter:'V · Ascending',example:'Paul Graham in the early YC years — spending time on people over product. Or a young professional who invests years in genuine relationships before any of them pay off financially.',g:{hE:2,eM:1,mT:1,mN:2,tN:3,nA:2,timeHealth:2}},
  balanced:{name:'Balanced',sub:'all couplings live\nboth feedbacks active',type:'thriving',chapter:'VI · Thriving',example:'A mid-career professional with a strong marriage, good health habits, meaningful work, and real friendships. Not famous. Not extreme. Quietly thriving on every dimension.',g:{hE:2,eM:2,eT:2,mT:2,mN:2,tN:2,nA:2,moneyHealth:2,timeHealth:2}},
  well_networked:{name:'Well-Networked',sub:'network generates\nmoney and time',type:'thriving',chapter:'VI · Thriving',example:'Reid Hoffman — a person whose relationships generate deals, capital, information, and introductions automatically. Does not trade time for money directly. The network does the work.',g:{hE:2,eM:1,mN:3,tN:3,nA:3,moneyHealth:2,timeHealth:2}},
  financially_free:{name:'Financially Free',sub:'M↔T decoupled\nmoney feeds health',type:'thriving',chapter:'VI · Thriving',example:'Someone with $3M in index funds and $80k/year expenses. Or a landlord with paid-off properties. Capital works independently. Time is no longer currency.',g:{hE:2,eM:1,mN:2,tN:1,nA:3,moneyHealth:3,timeHealth:2}},
  legacy_mode:{name:'Legacy Mode',sub:'system self-sustains\nfull feedback closure',type:'thriving',chapter:'VI · Thriving',example:'Warren Buffett at 70 — the system of relationships, capital, and reputation perpetuates itself without active input. Or a professor whose textbooks, students, and ideas outlive their daily effort.',g:{hE:2,eM:1,mN:3,tN:3,nA:3,moneyHealth:2,timeHealth:3}},
  peak_state:{name:'Peak State',sub:'health drives all\nboth loops maxed',type:'thriving',chapter:'VI · Thriving',example:'Rare and temporary. Muhammad Ali at his peak. A founder at the moment of their best company. A scientist at the height of their creative powers with full health and deep relationships. All systems firing.',g:{hE:3,eM:3,eT:3,mT:2,mN:2,tN:2,nA:3,moneyHealth:3,timeHealth:3}},
};
const STATE_KEYS = Object.keys(STATES);

const EDGES = [
  ['destitute','dependent'],['destitute','homeless'],['destitute','pivot'],
  ['dependent','subsistence'],['dependent','sick_broke'],
  ['homeless','subsistence'],['homeless','sick_broke'],
  ['sick_broke','subsistence'],['sick_broke','debt_spiral'],['sick_broke','pivot'],
  ['subsistence','debt_spiral'],['subsistence','wage_trapped'],['subsistence','burned_out'],
  ['subsistence','martyr'],['subsistence','pivot'],
  ['debt_spiral','wage_trapped'],['debt_spiral','burned_out'],['debt_spiral','sick_broke'],['debt_spiral','pivot'],
  ['wage_trapped','isolated_grinder'],['wage_trapped','burned_out'],['wage_trapped','time_poor_rich'],['wage_trapped','pivot'],
  ['burned_out','sick_broke'],['burned_out','martyr'],['burned_out','recluse_wealthy'],['burned_out','pivot'],
  ['martyr','burned_out'],['martyr','sick_broke'],['martyr','pivot'],
  ['isolated_grinder','time_poor_rich'],['isolated_grinder','burned_out'],['isolated_grinder','pivot'],
  ['time_poor_rich','workaholic'],['time_poor_rich','hedonist'],['time_poor_rich','recluse_wealthy'],['time_poor_rich','pivot'],
  ['workaholic','burned_out'],['workaholic','time_poor_rich'],['workaholic','pivot'],
  ['hedonist','debt_spiral'],['hedonist','recluse_wealthy'],['hedonist','pivot'],
  ['social_climber','time_poor_rich'],['social_climber','burned_out'],['social_climber','pivot'],
  ['recluse_wealthy','pivot'],['recluse_wealthy','hedonist'],
  ['pivot','early_career'],['pivot','hustle_phase'],['pivot','skill_compounder'],
  ['pivot','network_builder'],['pivot','self_investor'],
  ['early_career','hustle_phase'],['early_career','skill_compounder'],['early_career','network_builder'],
  ['early_career','workaholic'],['early_career','social_climber'],
  ['hustle_phase','skill_compounder'],['hustle_phase','isolated_grinder'],['hustle_phase','time_poor_rich'],
  ['hustle_phase','financially_free'],['hustle_phase','workaholic'],
  ['skill_compounder','self_investor'],['skill_compounder','network_builder'],
  ['skill_compounder','financially_free'],['skill_compounder','balanced'],
  ['network_builder','well_networked'],['network_builder','social_climber'],['network_builder','balanced'],
  ['self_investor','balanced'],['self_investor','financially_free'],['self_investor','well_networked'],
  ['balanced','well_networked'],['balanced','financially_free'],['balanced','legacy_mode'],['balanced','peak_state'],
  ['well_networked','legacy_mode'],['well_networked','peak_state'],
  ['financially_free','legacy_mode'],['financially_free','peak_state'],
  ['legacy_mode','peak_state'],
];
const FWD={},BWD={};
STATE_KEYS.forEach(k=>{FWD[k]=[];BWD[k]=[];});
EDGES.forEach(([a,b])=>{FWD[a].push(b);BWD[b].push(a);});

const EL={
  hE:'health → energy',eM:'energy → money',eT:'energy → time',
  mT:'money ↔ time',mN:'money → network',tN:'time → network',
  nA:'network → agency',moneyHealth:'money → health',timeHealth:'time → health',
};

// ══════════════════════════════════════════════════════════
// APP STATE
// ══════════════════════════════════════════════════════════
let currentId='destitute', goalId=null, mode='explore';

function goTo(id){
  currentId=id;
  render();
  updateFilmstrip();
  scrollFilmstripTo(id);
}

// ══════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════
function render(){
  const area=document.getElementById('card-area');
  const s=STATES[currentId];

  if(mode==='explore'){
    let fwdChips='', bwdChips='';
    FWD[currentId].forEach(id=>{
      const st=STATES[id];
      fwdChips+=`<div class="conn-chip ${st.type}" onclick="goTo('${id}')">${st.name}</div>`;
    });
    BWD[currentId].forEach(id=>{
      const st=STATES[id];
      bwdChips+=`<div class="conn-chip ${st.type}" onclick="goTo('${id}')">${st.name}</div>`;
    });

    area.innerHTML=`
      <div class="chapter-badge">${s.chapter}</div>
      <div class="glyph-wrap">${glyph(s.g,1)}</div>
      <div class="state-name ${s.type}">${s.name}</div>
      <div class="state-sub">${s.sub.replace(/\n/g,'<br>')}</div>
      <div class="state-example">${s.example}</div>
      ${fwdChips?`<div class="conn-section">
        <div class="conn-label">can lead to</div>
        <div class="conn-chips">${fwdChips}</div>
      </div>`:''}
      ${bwdChips?`<div class="conn-section">
        <div class="conn-label">can come from</div>
        <div class="conn-chips">${bwdChips}</div>
      </div>`:''}
      <button class="goal-btn" onclick="setGoal()" style="margin-top:8px">SET AS GOAL</button>
    `;
  } else {
    // compare mode
    const gs=goalId?STATES[goalId]:null;
    let actionHTML='';
    if(gs){
      const phrases=[];
      for(const k of Object.keys(EL)){
        const c=s.g[k]||0,gl=gs.g[k]||0;
        if(gl>c) phrases.push({dir:'strengthen',label:EL[k],cls:'pos'});
        else if(gl<c) phrases.push({dir:'weaken',label:EL[k],cls:'neg'});
      }
      actionHTML=phrases.length===0
        ?`<div class="action-same">already at goal state</div>`
        :`<div class="action-list">${phrases.map(p=>`<div class="action-item ${p.cls}"><span class="action-verb">${p.dir}</span><span class="action-edge">${p.label}</span></div>`).join('')}</div>`;
    }

    area.innerHTML=`
      <div class="compare-wrap">
        <div class="compare-section">
          <div class="compare-label now-label">NOW</div>
          <div class="compare-glyph">${glyph(s.g,1)}</div>
          <div class="compare-name state-name ${s.type}">${s.name}</div>
          <div class="compare-sub">${s.sub.replace(/\n/g,'<br>')}</div>
        </div>
        ${gs?actionHTML:''}
        <div class="compare-section" style="${gs?'':'opacity:0.4'}">
          <div class="compare-label ${gs?'goal-label':''}">${gs?'GOAL · '+gs.name:'NO GOAL SET'}</div>
          <div class="compare-glyph">${gs?glyph(gs.g,1):glyph({},1)}</div>
          ${gs?`<div class="compare-name state-name ${gs.type}">${gs.name}</div><div class="compare-sub">${gs.sub.replace(/\n/g,'<br>')}</div>`:`<div class="compare-sub">tap a state in the filmstrip, then set as goal</div>`}
        </div>
        <button class="goal-btn ${goalId?'clear':''}" onclick="toggleGoal()">${goalId?'CLEAR GOAL':'SET AS GOAL'}</button>
      </div>
    `;
  }
  area.scrollTop=0;
}

function setGoal(){
  goalId=currentId;
  setMode('compare');
}
function toggleGoal(){
  goalId=goalId?null:currentId;
  render(); updateFilmstrip();
}
function setMode(m){
  mode=m;
  document.getElementById('btn-explore').classList.toggle('active',m==='explore');
  document.getElementById('btn-compare').classList.toggle('active',m==='compare');
  render();
}

// ══════════════════════════════════════════════════════════
// FILMSTRIP
// ══════════════════════════════════════════════════════════
function buildFilmstrip(){
  document.getElementById('filmstrip').innerHTML=STATE_KEYS.map(id=>{
    const s=STATES[id];
    return`<div class="strip-card" id="sc-${id}" onclick="goTo('${id}')">
      ${glyph(s.g,0.15)}
      <div class="strip-name">${s.name}</div>
    </div>`;
  }).join('');
}
function updateFilmstrip(){
  document.querySelectorAll('.strip-card').forEach(c=>{
    const id=c.id.replace('sc-','');
    c.classList.toggle('active',id===currentId);
    c.classList.toggle('goal-card',id===goalId);
  });
}
function scrollFilmstripTo(id){
  const card=document.getElementById('sc-'+id);
  if(!card)return;
  card.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

// ══════════════════════════════════════════════════════════
// SWIPE NAVIGATION
// ══════════════════════════════════════════════════════════
let swipeStart=null;
const mainEl=document.getElementById('main');
const SWIPE_THRESH=60;

mainEl.addEventListener('touchstart',e=>{
  swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
mainEl.addEventListener('touchend',e=>{
  if(!swipeStart)return;
  const dx=e.changedTouches[0].clientX-swipeStart.x;
  const dy=e.changedTouches[0].clientY-swipeStart.y;
  swipeStart=null;
  // only horizontal swipes (ignore vertical scrolling)
  if(Math.abs(dx)<SWIPE_THRESH || Math.abs(dy)>Math.abs(dx)) return;

  // swipe left → next forward connection, swipe right → first backward connection
  const targets = dx<0 ? FWD[currentId] : BWD[currentId];
  if(targets.length>0){
    goTo(targets[0]);
    // hide hint after first successful swipe
    document.getElementById('swipe-hint').classList.add('hidden');
  }
});

// ══════════════════════════════════════════════════════════
// THEME
// ══════════════════════════════════════════════════════════
function getSystemTheme(){
  return window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
}
function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  const label=theme==='dark'?'◐ LIGHT':'◑ DARK';
  document.getElementById('theme-btn').textContent=label;
}
function toggleTheme(){
  const isDark=document.documentElement.dataset.theme==='dark';
  applyTheme(isDark?'light':'dark');
}
(function(){
  const theme=getSystemTheme();
  applyTheme(theme);
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{
    applyTheme(getSystemTheme());
  });
})();

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
buildFilmstrip();
render();
updateFilmstrip();
</script>
</body>
</html>
